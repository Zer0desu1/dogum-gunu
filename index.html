<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffd6e3">
<title>💌 Sana özel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6f9c;
    --pink-soft: #ffd6e3;
    --pink-deep: #e84a7f;
    --cream: #fff8f2;
    --lav: #e9dcff;
    --ink: #5a2a3f;
    --ink-soft: #8a5a6f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #ffe4ee 0%, #fff3f7 45%, #efe4ff 100%) fixed;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .script { font-family: "Dancing Script", cursive; font-weight: 700; }
  button { font: inherit; cursor: pointer; }

  /* floating background hearts */
  #bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #bg-hearts span {
    position: absolute; bottom: -40px; opacity: .55;
    animation: floatUp linear forwards;
  }
  @keyframes floatUp {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  /* night mode */
  #night-layer {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.6s;
    background: radial-gradient(ellipse at 50% 0%, #3b2b6e 0%, #1a1036 55%, #0e0820 100%);
  }
  body.dark #night-layer { opacity: 1; }
  .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 2.2s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
  body.dark h2.script { color: #ffb3d1; }
  body.dark .sub, body.dark .hero .typer, body.dark .scroll-hint, body.dark .wish small { color: #e3d4ff; }
  body.dark .wish, body.dark .reward-title { color: #ffc2d9; }
  body { transition: color 1s; }

  /* ---------- lock screen ---------- */
  #lock {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 16px;
    transition: opacity .8s, transform .8s;
  }
  #lock.gone { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .lock-card {
    width: min(380px, 100%);
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(10px);
    border-radius: 28px; padding: 36px 26px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(232,74,127,.18), 0 0 0 1px rgba(255,111,156,.12);
  }
  .lock-emoji { font-size: 64px; animation: bob 2.4s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-6deg); } }
  .lock-card h1 { font-family: "Dancing Script", cursive; font-size: 34px; margin: 8px 0 6px; color: var(--pink-deep); line-height: 1.1; }
  .lock-card p { margin: 0 0 18px; color: var(--ink-soft); }
  #lockForm { display: flex; gap: 8px; }
  #pw {
    flex: 1; min-width: 0;
    font: inherit; font-size: 22px; letter-spacing: 6px; text-align: center;
    padding: 12px 14px; border-radius: 16px;
    border: 2px solid var(--pink-soft); background: #fff; color: var(--ink);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  #pw:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,111,156,.15); }
  .btn {
    border: 0; border-radius: 16px; padding: 12px 20px;
    background: linear-gradient(135deg, #ff8fb1, var(--pink-deep));
    color: #fff; font-weight: 700; font-size: 16px;
    box-shadow: 0 8px 20px rgba(232,74,127,.3);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:active { transform: scale(.95); }
  .btn:disabled { opacity: .7; }
  .btn.ghost { background: #fff; color: var(--pink-deep); box-shadow: 0 4px 14px rgba(232,74,127,.15); }
  #err { min-height: 22px; margin: 10px 0 0 !important; color: var(--pink-deep) !important; font-weight: 600; }
  .shake { animation: shake .45s; }
  @keyframes shake {
    20%, 60% { transform: translateX(-9px); }
    40%, 80% { transform: translateX(9px); }
  }

  /* ---------- app ---------- */
  #app { position: relative; z-index: 1; }
  section {
    min-height: 100vh; padding: 64px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  h2.script { font-size: clamp(38px, 9vw, 58px); margin: 0 0 8px; color: var(--pink-deep); line-height: 1.1; transition: color 1s; }
  .sub { color: var(--ink-soft); margin: 0 0 32px; line-height: 1.6; font-size: 17px; transition: color 1s; }
  .sub b { color: var(--pink-deep); }
  .reveal { opacity: 0; transform: translateY(40px); transition: opacity 1s, transform 1s; }
  .reveal.in { opacity: 1; transform: none; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } }
  .wish { font-size: 22px; font-weight: 700; color: var(--pink-deep); margin: 24px 0 0; line-height: 1.5; animation: pop .8s cubic-bezier(.2,1.6,.4,1) both; }
  .wish small { font-size: 15px; color: var(--ink-soft); font-weight: 600; }

  .hero { position: relative; }
  .hero h1 {
    font-size: clamp(56px, 15vw, 110px); margin: 0; line-height: 1.05;
    background: linear-gradient(135deg, #ff6f9c, #c56cf0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: pop 1s cubic-bezier(.2,1.6,.4,1) both;
  }
  .chip {
    display: inline-block; margin: 20px 0 0; padding: 8px 18px; border-radius: 999px;
    background: rgba(255,255,255,.8); color: var(--pink-deep); font-weight: 700;
    box-shadow: 0 4px 14px rgba(232,74,127,.15);
    animation: pop .8s .5s cubic-bezier(.2,1.6,.4,1) both;
  }
  .typer { font-size: 19px; min-height: 4.4em; max-width: 420px; margin: 22px 0 0; line-height: 1.5; }
  .typer::after { content: "|"; animation: blink 1s steps(1) infinite; color: var(--pink); }
  @keyframes blink { 50% { opacity: 0; } }
  .balloons { font-size: 44px; margin-bottom: 10px; }
  .balloons span { display: inline-block; animation: bob 3s ease-in-out infinite; }
  .balloons span:nth-child(2) { animation-delay: -1s; font-size: 54px; filter: hue-rotate(260deg); }
  .balloons span:nth-child(3) { animation-delay: -2s; filter: hue-rotate(180deg); }
  .scroll-hint { position: absolute; bottom: 24px; font-size: 14px; color: var(--ink-soft); animation: bob 2s ease-in-out infinite; }

  /* photos */
  [data-media] {
    background: linear-gradient(110deg, var(--pink-soft) 30%, #fff0f5 50%, var(--pink-soft) 70%) 0 0 / 300% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  [data-media].loaded { animation: none; background: none; }
  @keyframes shimmer { to { background-position: -300% 0; } }
  img.land { aspect-ratio: 4 / 3; }
  img.port { aspect-ratio: 3 / 4; }
  img.zoom { cursor: zoom-in; }
  .photo {
    position: relative; background: #fff; padding: 10px; border-radius: 14px;
    width: min(320px, 100%); box-shadow: 0 14px 34px rgba(90,42,63,.2);
  }
  .photo img { width: 100%; object-fit: cover; display: block; border-radius: 8px; }
  .taped::before {
    content: ""; position: absolute; top: -11px; left: 50%; width: 76px; height: 22px; margin-left: -38px; z-index: 1;
    background: rgba(255,143,177,.5); transform: rotate(-4deg); border-radius: 2px;
  }
  .tilt-r { transform: rotate(2.5deg); }
  .tilt-l { transform: rotate(-2.5deg); }
  .reward { display: flex; flex-direction: column; align-items: center; margin-top: 34px; width: 100%; animation: pop .9s cubic-bezier(.2,1.4,.4,1) both; }
  .reward-title { font-size: 34px; color: var(--pink-deep); margin: 0 0 22px; transition: color 1s; }

  /* cake */
  .cake { position: relative; width: 260px; padding-top: 74px; margin-bottom: 28px; }
  .candles { position: absolute; top: 0; left: 0; right: 0; height: 74px; display: flex; justify-content: center; align-items: flex-end; gap: 20px; }
  .candle {
    position: relative; width: 13px; height: 46px; border-radius: 4px; cursor: pointer;
    background: repeating-linear-gradient(-45deg, #fff 0 6px, #ff9ebb 6px 12px);
    box-shadow: inset -2px 0 0 rgba(0,0,0,.06);
  }
  .candle::before { content: ""; position: absolute; left: 50%; top: -6px; width: 2px; height: 7px; margin-left: -1px; background: #6b4a3a; }
  .flame {
    position: absolute; left: 50%; bottom: calc(100% + 4px);
    width: 16px; height: 26px; margin-left: -8px;
    background: radial-gradient(ellipse at 50% 75%, #fff 0 18%, #ffe066 35%, #ff9f43 70%, transparent 72%);
    border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
    transform-origin: 50% 100%;
    animation: flicker .12s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 10px rgba(255,190,70,.9));
    transition: opacity .3s, transform .3s;
  }
  @keyframes flicker { to { transform: scaleY(1.08) skewX(3deg); } }
  .candle.out .flame { opacity: 0; transform: scale(0); animation: none; }
  .candle.out::after {
    content: ""; position: absolute; left: 50%; bottom: calc(100% + 6px); width: 8px; height: 8px; margin-left: -4px;
    border-radius: 50%; background: rgba(160,160,160,.6);
    animation: smoke 1.2s ease-out forwards;
  }
  @keyframes smoke { to { transform: translateY(-50px) scale(3); opacity: 0; } }
  .tier { margin: 0 auto; position: relative; }
  .tier.top {
    width: 190px; height: 64px; border-radius: 16px 16px 6px 6px;
    background: linear-gradient(#fff5f8, #ffe0ea);
  }
  .tier.top::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -12px; height: 18px;
    background: radial-gradient(circle at 12px 0, #ffe0ea 11px, transparent 12px) 0 0 / 24px 18px repeat-x;
    z-index: 1;
  }
  .cherries { padding-top: 16px; font-size: 20px; letter-spacing: 6px; }
  .tier.bottom {
    width: 260px; height: 86px; border-radius: 16px;
    background: linear-gradient(#ffb3c9, #ff8fb1);
    box-shadow: inset 0 -10px 0 rgba(0,0,0,.05);
  }
  .tier.bottom::before {
    content: ""; position: absolute; left: 0; right: 0; top: 42px; height: 8px;
    background: radial-gradient(circle, #fff 3px, transparent 4px) 0 0 / 20px 8px repeat-x;
  }
  .plate { width: 300px; height: 20px; margin: -6px -20px 0; background: #fff; border-radius: 50%; box-shadow: 0 10px 24px rgba(232,74,127,.18); }

  /* scratch card */
  .scratch {
    position: relative; width: min(360px, 100%); aspect-ratio: 4 / 3;
    border-radius: 18px; overflow: hidden; border: 7px solid #fff;
    box-shadow: 0 16px 40px rgba(232,74,127,.25);
  }
  .scratch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scratch canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .9s; }
  .scratch canvas.gone { opacity: 0; pointer-events: none; }

  /* reasons */
  .reasons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: min(640px, 100%); }
  @media (min-width: 640px) { .reasons { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { perspective: 800px; aspect-ratio: 1; cursor: pointer; }
  .card .inner { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.3,1.3,.5,1); transform-style: preserve-3d; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .front, .back {
    position: absolute; inset: 0; border-radius: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px;
    box-shadow: 0 8px 22px rgba(232,74,127,.15);
  }
  .front { background: linear-gradient(135deg, #fff, var(--pink-soft)); font-size: 40px; }
  .front span { font-size: 15px; font-weight: 700; color: var(--pink-deep); margin-top: 6px; }
  .back { background: linear-gradient(135deg, #ff8fb1, #c56cf0); color: #fff; transform: rotateY(180deg); font-weight: 600; font-size: 15px; line-height: 1.45; }

  /* developing polaroid */
  .develop {
    --p: 0;
    background: #fff; padding: 12px 12px 54px; border-radius: 4px; width: min(280px, 100%);
    box-shadow: 0 16px 40px rgba(90,42,63,.22); transform: rotate(-2deg); cursor: pointer; user-select: none;
  }
  .develop.wiggle { animation: wiggle .4s; }
  @keyframes wiggle { 25% { transform: rotate(-9deg) translateX(-6px); } 75% { transform: rotate(5deg) translateX(6px); } }
  .dev-photo { overflow: hidden; border-radius: 2px; background: #2a1d17; }
  .dev-photo img {
    width: 100%; object-fit: cover; display: block;
    filter: brightness(calc(.06 + .94 * var(--p))) sepia(calc(1 - var(--p))) contrast(calc(.5 + .5 * var(--p))) blur(calc((1 - var(--p)) * 10px));
    transition: filter .7s;
  }
  .develop.locked img { cursor: pointer; }

  /* puzzle */
  .puzzle {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    width: min(300px, 100%); aspect-ratio: 3 / 4; padding: 6px;
    background: #fff; border-radius: 14px; box-shadow: 0 16px 40px rgba(232,74,127,.22);
    transition: gap .6s;
  }
  .tile {
    border: 0; padding: 0; border-radius: 6px;
    background-color: var(--pink-soft); background-image: var(--img); background-size: 300% 300%;
    transition: transform .2s, box-shadow .2s, border-radius .6s;
  }
  .tile.sel { transform: scale(.88); box-shadow: 0 0 0 3px var(--pink), 0 6px 16px rgba(232,74,127,.4); }
  .tile.pop { animation: pop .3s; }
  .puzzle.solved { gap: 0; cursor: zoom-in; }
  .puzzle.solved .tile { border-radius: 0; cursor: zoom-in; }

  /* envelope */
  .envelope { position: relative; width: 260px; height: 170px; cursor: pointer; animation: bob 3s ease-in-out infinite; }
  .pocket { position: absolute; inset: 0; background: linear-gradient(135deg, #ffc2d4, #ff9ebb); border-radius: 10px; box-shadow: 0 14px 34px rgba(232,74,127,.25); }
  .pocket::before {
    content: ""; position: absolute; inset: 0; border-radius: 10px;
    background: linear-gradient(to top right, transparent 49.5%, #ffb0c7 50%) left / 50% 100% no-repeat,
                linear-gradient(to top left, transparent 49.5%, #ffb0c7 50%) right / 50% 100% no-repeat;
    opacity: .6;
  }
  .flap {
    position: absolute; left: 0; right: 0; top: 0; height: 100px; z-index: 2;
    background: #ff8fb1; clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transition: transform .6s;
  }
  .envelope.open .flap { transform: rotateX(180deg); z-index: 0; }
  .seal { position: absolute; left: 50%; top: 78px; transform: translate(-50%, -50%); font-size: 34px; z-index: 3; transition: opacity .3s; }
  .envelope.open .seal { opacity: 0; }
  .envelope.open { animation: none; }
  .letter {
    width: min(520px, 100%); margin-top: -40px; position: relative; z-index: 4;
    background: var(--cream); border-radius: 18px; padding: 28px 24px;
    text-align: left; line-height: 1.75; font-size: 17px;
    box-shadow: 0 20px 50px rgba(232,74,127,.2);
    background-image: repeating-linear-gradient(transparent 0 29px, rgba(255,111,156,.12) 29px 30px);
    animation: letterUp .9s cubic-bezier(.2,1.2,.4,1) both;
  }
  @keyframes letterUp { from { transform: translateY(60px) scale(.9); opacity: 0; } }
  .letter p { margin: 0 0 14px; }
  .letter .big { font-size: 30px; color: var(--pink-deep); }
  .letter .right { text-align: right; margin: 0; }
  .letter-photo { float: right; width: 128px; padding: 6px; margin: -8px -6px 10px 14px; transform: rotate(4deg); }
  .letter-photo img { border-radius: 4px; }

  /* the question */
  .ask { position: relative; width: min(360px, 100%); height: 240px; }
  .ask .btn { position: absolute; top: 70px; transition: left .25s, top .25s, transform .3s; white-space: nowrap; }
  #yesBtn { left: 12%; }
  #noBtn { right: 12%; }

  /* coupons */
  .coupons { display: grid; gap: 14px; width: min(520px, 100%); }
  .coupon {
    display: flex; align-items: center; gap: 14px; text-align: left;
    background: #fff; border-radius: 18px; padding: 14px 14px 14px 18px; position: relative;
    border: 2px dashed #ffb3c9; box-shadow: 0 6px 18px rgba(232,74,127,.1);
  }
  .c-emoji { font-size: 32px; }
  .coupon > div:nth-child(2) { flex: 1; min-width: 0; }
  .coupon b { display: block; font-size: 17px; }
  .coupon small { color: var(--ink-soft); font-weight: 600; }
  .coupon button {
    border: 0; border-radius: 12px; padding: 9px 14px; font-weight: 700;
    background: var(--pink-soft); color: var(--pink-deep); flex-shrink: 0;
  }
  .coupon.used { opacity: .7; }
  .coupon.used button { background: #eee; color: #999; }
  .coupon.used::after {
    content: "Kullanıldı 💋"; position: absolute; right: 18px; top: 50%;
    transform: translateY(-50%) rotate(-12deg);
    border: 3px solid var(--pink-deep); color: var(--pink-deep); border-radius: 10px;
    padding: 4px 10px; font-weight: 700; background: rgba(255,255,255,.9);
    animation: stamp .35s cubic-bezier(.2,1.8,.4,1) both;
  }
  @keyframes stamp { from { transform: translateY(-50%) rotate(-12deg) scale(2.4); opacity: 0; } }

  /* night */
  .moon { font-size: 72px; margin-bottom: 18px; filter: drop-shadow(0 0 30px rgba(255,236,170,.8)); animation: bob 4s ease-in-out infinite; }
  .photo.glow { width: min(280px, 100%); box-shadow: 0 0 60px rgba(255,214,150,.45), 0 16px 40px rgba(0,0,0,.35); }
  .night-text { margin: 26px 0 0; font-size: 19px; }

  /* final */
  .big-heart { font-size: 80px; animation: beat 1.1s ease-in-out infinite; cursor: pointer; user-select: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  .video-frame {
    position: relative; width: min(440px, 100%); aspect-ratio: 848 / 478; margin: 18px 0 22px;
    border-radius: 22px; overflow: hidden; border: 6px solid #fff;
    box-shadow: 0 16px 40px rgba(232,74,127,.25);
  }
  .video-frame video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sound {
    position: absolute; right: 10px; bottom: 10px; border: 0; width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,.88); font-size: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.2);
  }

  /* full-screen photo */
  #lightbox {
    position: fixed; inset: 0; z-index: 40; padding: 16px; cursor: zoom-out;
    display: flex; align-items: center; justify-content: center;
    background: rgba(50,15,32,.88); backdrop-filter: blur(6px);
    animation: fadeIn .25s both;
  }
  #lightbox[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } }
  #lightbox img { max-width: 100%; max-height: 88vh; border: 8px solid #fff; border-radius: 6px; display: block; animation: pop .4s cubic-bezier(.2,1.4,.4,1) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div id="night-layer"></div>
<div id="bg-hearts"></div>

<section id="lock">
  <div class="lock-card" id="lockCard">
    <div class="lock-emoji">💌</div>
    <h1>Bu site sadece<br>bir kişi için</h1>
    <p>O kişi sensen, şifreyi biliyorsun 🤭</p>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="••••" aria-label="Şifre" autocomplete="off">
      <button class="btn" id="openBtn">Aç 🔓</button>
    </form>
    <p id="err" role="alert"></p>
  </div>
</section>

<main id="app" hidden></main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

  // older versions remembered the password; forget it
  try { localStorage.removeItem("bd-pw"); localStorage.removeItem("bd-coupons"); } catch {}

  /* ---------- floating hearts + stars ---------- */
  const HEARTS = ["💖", "💗", "💕", "🌸", "✨", "💞"];
  function spawnHeart() {
    const s = document.createElement("span");
    s.textContent = HEARTS[Math.random() * HEARTS.length | 0];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = 14 + Math.random() * 22 + "px";
    s.style.animationDuration = 7 + Math.random() * 8 + "s";
    $("#bg-hearts").appendChild(s);
    s.addEventListener("animationend", () => s.remove());
  }
  setInterval(spawnHeart, 700);
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("span"), size = Math.random() * 2.2 + .8;
    s.className = "star";
    Object.assign(s.style, {
      left: Math.random() * 100 + "%", top: Math.random() * 100 + "%",
      width: size + "px", height: size + "px",
      animationDelay: -Math.random() * 3 + "s", animationDuration: 1.5 + Math.random() * 2 + "s",
    });
    $("#night-layer").appendChild(s);
  }

  /* ---------- confetti ---------- */
  const cv = $("#confetti"), cx = cv.getContext("2d");
  const COLORS = ["#ff6f9c", "#ffb3c9", "#c56cf0", "#ffe066", "#7fd8ff", "#ff9f43"];
  let parts = [], running = false;
  function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
  addEventListener("resize", resize); resize();
  function confetti(n = 160, x = innerWidth / 2, y = innerHeight / 3) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      parts.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6,
        r: 4 + Math.random() * 5, rot: Math.random() * 6, vr: (Math.random() - .5) * .3,
        c: COLORS[Math.random() * COLORS.length | 0], heart: Math.random() < .25, life: 0,
      });
    }
    if (!running) { running = true; requestAnimationFrame(tick); }
  }
  const confettiAt = (el, n) => confetti(n, ...centerOf(el));
  function tick() {
    const d = devicePixelRatio;
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 400);
    for (const p of parts) {
      p.life++; p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.rot); cx.fillStyle = p.c;
      if (p.heart) { cx.font = `${p.r * 4 * d}px serif`; cx.fillText("💗", 0, 0); }
      else cx.fillRect(-p.r * d, -p.r * .5 * d, p.r * 2 * d, p.r * d);
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }

  /* ---------- happy birthday melody ---------- */
  // resolves when the song ends; only one song plays at a time
  let songPlaying = null;
  function playSong() {
    if (songPlaying) return songPlaying;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return Promise.resolve();
    const ac = new AC();
    const N = { G4: 392, A4: 440, B4: 494, C5: 523, D5: 587, E5: 659, F5: 698, G5: 784 };
    const song = [
      ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2],
      ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2],
      ["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2],
      ["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 2.5],
    ];
    const beat = .38;
    let t = ac.currentTime + .1;
    for (const [n, len] of song) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "triangle"; o.frequency.value = N[n];
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.22, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + len * beat * .95);
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + len * beat);
      t += len * beat;
    }
    songPlaying = new Promise(done => setTimeout(() => {
      ac.close(); songPlaying = null; done();
    }, (t - ac.currentTime + .3) * 1000));
    return songPlaying;
  }

  /* ---------- sections ---------- */
  function initCountdown() {
    const el = $("#countdown");
    const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const bday = new Date(now.getFullYear(), el.dataset.month - 1, +el.dataset.day);
    const days = Math.round((bday - today) / 864e5);
    el.textContent = days === 0 ? "🎉 Bugün senin günün!"
      : days > 0 ? `🎂 Doğum gününe ${days} gün kaldı`
      : "💫 Yeni yaşın kutlu olsun";
  }

  function initCake() {
    const candles = $$(".candle");
    const lit = () => candles.filter(c => !c.classList.contains("out"));
    let celebrated = false;
    function blowOut(c) {
      if (!c || c.classList.contains("out")) return;
      c.classList.add("out");
      if (lit().length || celebrated) return;
      celebrated = true;
      $("#wish").hidden = false;
      $("#micBtn").hidden = true;
      const r = $("#cake").getBoundingClientRect();
      confetti(220, r.left + r.width / 2, r.top + 40);
      playSong();
    }
    candles.forEach(c => c.addEventListener("click", () => blowOut(c)));

    $("#micBtn").addEventListener("click", async e => {
      const btn = e.currentTarget;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        btn.textContent = "🌬️ Şimdi üfle!";
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const an = ac.createAnalyser(); an.fftSize = 1024;
        ac.createMediaStreamSource(stream).connect(an);
        const buf = new Uint8Array(an.fftSize);
        let loud = 0;
        (function listen() {
          an.getByteTimeDomainData(buf);
          let sum = 0;
          for (const v of buf) { const x = (v - 128) / 128; sum += x * x; }
          const rms = Math.sqrt(sum / buf.length);
          if (rms > .16) { if (++loud % 5 === 0) blowOut(lit()[Math.random() * lit().length | 0]); }
          else loud = Math.max(0, loud - 1);
          if (lit().length) requestAnimationFrame(listen);
          else { stream.getTracks().forEach(t => t.stop()); ac.close(); }
        })();
      } catch {
        btn.textContent = "Mikrofon açılamadı, mumlara dokun 🕯️";
        btn.disabled = true;
      }
    });
  }

  function initScratch() {
    const box = $("#scratch"), c = $("canvas", box), g = c.getContext("2d");
    let down = false, last = null, strokes = 0, done = false;
    function paint() {
      const w = box.clientWidth, h = box.clientHeight, d = devicePixelRatio || 1;
      c.width = w * d; c.height = h * d;
      g.setTransform(d, 0, 0, d, 0, 0);
      const grad = g.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#ffc2d4"); grad.addColorStop(.5, "#eadcff"); grad.addColorStop(1, "#ffb3c9");
      g.fillStyle = grad; g.fillRect(0, 0, w, h);
      g.globalAlpha = .35; g.font = "20px serif";
      for (let i = 0; i < 36; i++) g.fillText(["💖", "✨", "🌸"][i % 3], Math.random() * w, Math.random() * h);
      g.globalAlpha = 1; g.textAlign = "center"; g.fillStyle = "#e84a7f";
      g.font = "700 34px 'Dancing Script', cursive"; g.fillText("Kazı kazan", w / 2, h / 2);
      g.font = "600 15px Quicksand, sans-serif"; g.fillText("👆 parmağınla kazı", w / 2, h / 2 + 30);
      g.globalCompositeOperation = "destination-out";
      g.lineCap = g.lineJoin = "round"; g.lineWidth = 46;
    }
    document.fonts.ready.then(paint);
    const at = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    function scratch(e) {
      if (!down || done) return;
      const p = at(e);
      g.beginPath(); g.moveTo(...(last || p)); g.lineTo(...p); g.stroke();
      last = p;
      if (++strokes % 12 === 0) check();
    }
    function check() {
      const data = g.getImageData(0, 0, c.width, c.height).data;
      let clear = 0, total = 0;
      for (let i = 3; i < data.length; i += 64) { total++; if (data[i] === 0) clear++; }
      if (clear / total < .5) return;
      done = true;
      c.classList.add("gone");
      $("img", box).classList.add("zoom");
      $("#scratchWin").hidden = false;
      confettiAt(box, 140);
    }
    c.addEventListener("pointerdown", e => { down = true; last = null; c.setPointerCapture(e.pointerId); scratch(e); });
    c.addEventListener("pointermove", scratch);
    c.addEventListener("pointerup", () => { down = false; check(); });
    c.addEventListener("pointercancel", () => { down = false; });
  }

  function initReasons() {
    const cards = $$(".card"), seen = new Set();
    cards.forEach((c, i) => c.addEventListener("click", async () => {
      c.classList.toggle("flipped");
      seen.add(i);
      $("#reasonCount").textContent = `${seen.size}/${cards.length}`;
      const reward = $("#reasonReward");
      if (seen.size < cards.length || !reward.hidden) return;
      await wait(900);
      reward.hidden = false;
      reward.scrollIntoView({ behavior: "smooth", block: "center" });
      await wait(500);
      confettiAt(reward, 150);
    }));
  }

  function initDevelop() {
    const box = $("#develop");
    let p = 0, askedMotion = false, lastShake = 0;
    function shake() {
      if (p >= 1) return;
      p = Math.min(1, p + .125);
      box.style.setProperty("--p", p);
      box.classList.remove("wiggle"); void box.offsetWidth; box.classList.add("wiggle");
      if (p < 1) return;
      box.classList.remove("locked");
      $("img", box).classList.add("zoom");
      $("#devHint").textContent = "Fotoğraf hazır 📸";
      $("#devDone").hidden = false;
      setTimeout(() => confettiAt(box, 120), 500);
    }
    box.addEventListener("click", () => {
      // iOS asks for motion permission on the first tap
      if (!askedMotion && window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) {
        askedMotion = true; DeviceMotionEvent.requestPermission().catch(() => {});
      }
      shake();
    });
    addEventListener("devicemotion", e => {
      const a = e.accelerationIncludingGravity;
      if (!a || Math.hypot(a.x || 0, a.y || 0, a.z || 0) < 22) return;
      const r = box.getBoundingClientRect(), now = Date.now();
      if (r.bottom < 0 || r.top > innerHeight || now - lastShake < 280) return;
      lastShake = now; shake();
    });
  }

  function initPuzzle() {
    const board = $("#puzzle"), src = $("#puzzleSrc"), N = 3;
    const order = [...Array(N * N).keys()];
    const solvedNow = () => order.every((t, i) => t === i);
    do order.sort(() => Math.random() - .5); while (solvedNow());
    let sel = null, moves = 0, solved = false;
    const tiles = order.map((_, pos) => {
      const t = document.createElement("button");
      t.className = "tile"; t.setAttribute("aria-label", "Parça " + (pos + 1));
      t.addEventListener("click", () => tap(pos));
      board.appendChild(t);
      return t;
    });
    function render() {
      tiles.forEach((t, pos) => {
        const k = order[pos];
        t.style.backgroundPosition = `${(k % N) * 50}% ${Math.floor(k / N) * 50}%`;
        t.classList.toggle("sel", sel === pos);
      });
    }
    function tap(pos) {
      if (solved) return openZoom(src.src);
      if (sel === null) { sel = pos; return render(); }
      if (sel !== pos) {
        [order[sel], order[pos]] = [order[pos], order[sel]];
        $("#puzzleMoves").textContent = ++moves + " hamle";
        for (const t of [tiles[sel], tiles[pos]]) { t.classList.remove("pop"); void t.offsetWidth; t.classList.add("pop"); }
      }
      sel = null;
      render();
      if (!solvedNow()) return;
      solved = true;
      board.classList.add("solved");
      $("#puzzleDone").hidden = false;
      setTimeout(() => confettiAt(board, 180), 400);
    }
    src.addEventListener("load", () => board.style.setProperty("--img", `url(${src.src})`));
    render();
  }

  function initLetter() {
    $("#envelope").addEventListener("click", e => {
      const env = e.currentTarget;
      if (env.classList.contains("open")) return;
      env.classList.add("open");
      setTimeout(() => { $("#letter").hidden = false; confettiAt(env, 60); }, 500);
    });
  }

  function initQuestion() {
    const area = $("#ask"), yes = $("#yesBtn"), no = $("#noBtn");
    const NO = ["Emin misin? 🥺", "Bir daha düşün 🤔", "Yanlış tuş galiba 😅", "Olmaz öyle şey 🙅‍♀️", "Kaçamazsın 😌", "Hâlâ mı? 😭"];
    let tries = 0;
    function flee(e) {
      e.preventDefault();
      no.textContent = NO[tries++ % NO.length];
      yes.style.transform = `scale(${Math.min(1 + tries * .15, 1.9)})`;
      // yes button's final (scaled) box, padded, relative to the area
      const a = area.getBoundingClientRect(), b = no.getBoundingClientRect();
      const s = Math.min(1 + tries * .15, 1.9), y = yes.offsetLeft, yt = yes.offsetTop;
      const yw = yes.offsetWidth * s, yh = yes.offsetHeight * s;
      const yl = y + yes.offsetWidth / 2 - yw / 2 - 12, ytop = yt + yes.offsetHeight / 2 - yh / 2 - 12;
      let x, top;
      for (let i = 0; i < 40; i++) {
        x = Math.random() * (a.width - b.width); top = Math.random() * (a.height - b.height);
        const overlaps = x < yl + yw + 24 && x + b.width > yl && top < ytop + yh + 24 && top + b.height > ytop;
        if (!overlaps) break;
      }
      no.style.right = "auto";
      no.style.left = x + "px";
      no.style.top = top + "px";
    }
    no.addEventListener("pointerdown", flee);
    no.addEventListener("mouseenter", flee);
    no.addEventListener("click", flee);
    yes.addEventListener("click", async () => {
      area.hidden = true;
      $(".ask-q").textContent = "Beni seviyor musun? Evet! 💖";
      const r = $("#yesReveal");
      r.hidden = false;
      await wait(300);
      confettiAt(r, 200);
    });
  }

  function initCoupons() {
    $$(".coupon").forEach(c => {
      const btn = $("button", c);
      btn.addEventListener("click", () => {
        if (!confirm("Bu kuponu şimdi kullanmak istiyor musun? 💕")) return;
        c.classList.add("used"); btn.disabled = true;
        const r = c.getBoundingClientRect();
        confetti(50, r.right - 60, r.top + r.height / 2);
      });
    });
  }

  function initNight() {
    const btn = $("#nightBtn");
    btn.addEventListener("click", () => {
      const dark = document.body.classList.toggle("dark");
      btn.textContent = dark ? "Işıkları aç ☀️" : "Işıkları kapat 🌙";
      if (dark) $("#night").hidden = false;
    });
  }

  function initFinal() {
    const vid = $(".video-frame video");
    $("#soundBtn").addEventListener("click", e => {
      vid.muted = !vid.muted;
      if (!vid.muted) { vid.currentTime = 0; vid.play().catch(() => {}); }
      e.currentTarget.textContent = vid.muted ? "🔇" : "🔊";
    });
    const againBtn = $("#againBtn"), againText = againBtn.textContent;
    againBtn.addEventListener("click", async () => {
      if (againBtn.disabled) return;
      againBtn.disabled = true; againBtn.textContent = "🎶 Çalıyor…";
      confetti(260);
      await playSong();
      againBtn.disabled = false; againBtn.textContent = againText;
    });
    $(".big-heart").addEventListener("click", e => confetti(40, e.clientX, e.clientY));
  }

  /* ---------- full-screen photo ---------- */
  const lb = $("#lightbox");
  function openZoom(src) {
    if (!src) return;
    $("img", lb).src = src;
    lb.hidden = false; document.body.style.overflow = "hidden";
  }
  const closeZoom = () => { lb.hidden = true; document.body.style.overflow = ""; };
  lb.addEventListener("click", closeZoom);
  addEventListener("keydown", e => { if (e.key === "Escape") closeZoom(); });

  function initApp() {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { threshold: .12 });
    $$(".reveal").forEach(el => io.observe(el));

    const typer = $(".typer"), text = [...typer.dataset.text];
    let i = 0;
    setTimeout(function type() {
      typer.textContent = text.slice(0, ++i).join("");
      if (i < text.length) setTimeout(type, 45);
    }, 900);

    $("#app").addEventListener("click", e => {
      const img = e.target.closest("img.zoom.loaded");
      if (img) openZoom(img.src);
    });

    initCountdown();
    initCake();
    initScratch();
    initReasons();
    initDevelop();
    initPuzzle();
    initLetter();
    initQuestion();
    initCoupons();
    initNight();
    initFinal();

    setTimeout(() => confetti(200), 400);
  }

  /* ---------- unlock (AES-GCM, key from PBKDF2) ---------- */
  const P = JSON.parse($("#payload").textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(P.s), iterations: P.i, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.v) }, key, b64(P.c));
    return { html: new TextDecoder().decode(pt), key };
  }
  // photos/video live in m/<name>.bin as iv (12 bytes) + ciphertext
  function loadMedia(key) {
    const cache = new Map();
    const get = name => {
      if (!cache.has(name)) cache.set(name, fetch("m/" + name + ".bin")
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(buf => crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(buf, 0, 12) }, key, new Uint8Array(buf, 12)))
        .then(pt => URL.createObjectURL(new Blob([pt], { type: name.endsWith(".mp4") ? "video/mp4" : "image/jpeg" }))));
      return cache.get(name);
    };
    for (const el of $$("[data-media]")) {
      get(el.dataset.media).then(url => {
        el.src = url; el.classList.add("loaded");
        if (el.tagName === "VIDEO") el.play().catch(() => {});
      }).catch(() => {});
    }
  }
  // "05.03", "5/3", "0503" all become "0503"
  function normalize(raw) {
    const parts = raw.trim().split(/[^\d]+/).filter(Boolean);
    if (parts.length >= 2) return parts[0].padStart(2, "0") + parts[1].padStart(2, "0");
    return raw.replace(/\D/g, "").slice(0, 4);
  }
  async function tryUnlock(pw) {
    try { return await decrypt(pw); } catch { return null; }
  }
  function open({ html, key }) {
    $("#lock").classList.add("gone");
    setTimeout(() => $("#lock").remove(), 900);
    const app = $("#app");
    app.innerHTML = html;
    app.hidden = false;
    scrollTo(0, 0);
    initApp();
    loadMedia(key);
  }

  const ERRORS = ["Olmadı 🙈 bir daha dene", "Hmm, o değil 🤔", "Yaklaştın gibi… ama değil 😅", "Biraz daha düşün 💭"];
  let fails = 0;
  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#openBtn"), pw = normalize($("#pw").value);
    if (!pw) return;
    btn.disabled = true; btn.textContent = "…";
    const res = await tryUnlock(pw);
    btn.disabled = false; btn.textContent = "Aç 🔓";
    if (res) return open(res);
    $("#err").textContent = ERRORS[fails++ % ERRORS.length];
    const card = $("#lockCard");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    $("#pw").select();
  });
})();
</script>
</body>
